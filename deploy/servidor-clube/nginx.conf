server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: every route falls back to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Must always be fresh (backend address, app updates)
  location = /config.js     { add_header Cache-Control "no-cache"; }
  location = /index.html    { add_header Cache-Control "no-cache"; }
  location = /sw.js         { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }

  # Hashed build files never change
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
